<style>
:root {
  --red: #AE1B25;        /* rosso del logo */
  --bg: #F9F7F5;
  --ink: #1C2230;
  --muted: #5B6273;
  --paper: #FFFFFF;
  --line: #D5D9E0;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
body, button, a, input { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  text-transform: uppercase;
  -webkit-font-smoothing: antialiased;
}
main {
  max-width: 26rem;
  margin: 0 auto;
  padding: 1.25rem 1.5rem 2.5rem;
}

/* top bar */
.top { display: flex; justify-content: space-between; align-items: center; }
.brand {
  display: flex; align-items: center; gap: 0.6rem;
  color: var(--red);
  font-weight: 800; font-size: 0.875rem; letter-spacing: 0.08em;
}
.brand img { width: 44px; height: auto; display: block; }
.lang {
  font-family: inherit; font-weight: 600; font-size: 0.75rem; letter-spacing: 0.08em;
  color: var(--muted); background: none; border: 1px solid var(--line);
  border-radius: 999px; padding: 0.3rem 0.75rem; cursor: pointer; text-transform: uppercase;
}

/* filo rosso animato */
.thread { display: block; width: 100%; height: 120px; margin: 0.25rem 0 1rem; overflow: visible; }
.thread path {
  fill: none; stroke: var(--red); stroke-width: 6; stroke-linecap: round;
  stroke-dasharray: 900; stroke-dashoffset: 900;
  animation: pull 1.6s cubic-bezier(.6,.05,.25,1) .2s forwards;
}
@keyframes pull { to { stroke-dashoffset: 0; } }

h1 {
  font-size: clamp(2rem, 9.5vw, 2.6rem);
  line-height: 1.02;
  letter-spacing: -0.02em;
  font-weight: 800;
  margin: 0 0 0.75rem;
}
.lead {
  color: var(--muted);
  font-size: 0.875rem; font-weight: 600; letter-spacing: 0.04em; line-height: 1.5;
  margin: 0 0 1.5rem;
}

/* la nota con la quest, legata al filo */
.note {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1.6rem 1.4rem 1.2rem;
  transform: rotate(-1.2deg);
  box-shadow: 0 1px 0 var(--line), 0 14px 30px -18px rgba(28,34,48,.35);
}
.note::before {
  content: ""; position: absolute; top: -8px; left: 1.4rem;
  width: 16px; height: 16px; border-radius: 50%; background: var(--red);
}
.quest {
  font-family: "Gochi Hand", "Comic Sans MS", cursive; font-weight: 400;
  text-transform: none;
  font-size: 1.65rem; line-height: 1.25; margin: 0;
  min-height: 4.2em;
  transition: opacity .25s ease;
}
.quest.swap { opacity: 0; }
.reroll {
  margin-top: 0.8rem;
  font-family: inherit; font-weight: 700; font-size: 0.75rem; letter-spacing: 0.08em;
  color: var(--red); background: none; border: none; padding: 0.3rem 0;
  cursor: pointer; text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px;
}

/* app */
.app { margin-top: 2.6rem; }
.app h2 {
  font-size: 1rem; font-weight: 800; line-height: 1.35; letter-spacing: 0.01em;
  margin: 0 0 1rem;
}
.stores { display: flex; flex-direction: column; gap: 0.6rem; }
.store {
  display: block; text-align: center; text-decoration: none;
  font-weight: 700; font-size: 0.9rem; letter-spacing: 0.06em;
  padding: 1rem; border-radius: 12px;
  border: 2px solid var(--ink); color: var(--ink);
}
.store.primary { background: var(--red); border-color: var(--red); color: #FFFFFF; }
.ig {
  display: inline-block; margin-top: 1.1rem;
  color: var(--muted); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em;
}
footer {
  margin-top: 2.5rem; color: var(--red);
  font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em;
}

:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) {
  .thread path { animation: none; stroke-dashoffset: 0; }
  .quest { transition: none; }
}
</style>
</head>

<main>

    ig: "or follow us on Instagram"

  it: {

    lead: "Hai trovato lo sticker. Ecco la tua missione:",
    reroll: "Dammene un’altra",
    h2: "Vuoi altre side quest per te e i tuoi amici?",
    ios: "Scarica per iPhone", android: "Scarica per Android",

  fr: {

    lead: "Tu as trouvé le sticker. Voici ta mission :",

  },
  es: {

    lead: "Has encontrado el sticker. Esta es tu misión:",

    h2: "¿Quieres más side quests para ti y tus amigos?",
    ios: "Descargar para iPhone", android: "Descargar para Android",
    ig: "o síguenos en Instagram"
  }
};

const $ = id => document.getElementById(id);
const LANGS = ["en", "it", "fr", "es"];
let lang = (navigator.languages || [navigator.language || "en"])
  .map(l => l.toLowerCase().slice(0, 2)).find(l => LANGS.includes(l)) || "en";
/* shuffled deck: every quest comes up once before any repeats */
let deck = [];
function nextQuest(prev) {
  if (!deck.length) {
    deck = QUESTS.en.map((_, i) => i);
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    if (deck.length > 1 && deck[deck.length - 1] === prev) deck.unshift(deck.pop());
  }
  return deck.pop();
}
let idx = nextQuest(-1);

function render() {
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  $("t-h1").textContent = t.h1;
  $("t-lead").textContent = t.lead;
  $("reroll").textContent = t.reroll;
  $("t-h2").textContent = t.h2;
  $("ios").textContent = t.ios;
  $("android").textContent = t.android;
  $("ig").textContent = t.ig;
  $("lang").textContent = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length].toUpperCase();
  $("quest").textContent = QUESTS[lang][idx];
}

$("reroll").addEventListener("click", () => {
  const q = $("quest");
  q.classList.add("swap");
  setTimeout(() => {
    idx = nextQuest(idx);
    q.textContent = QUESTS[lang][idx];
    q.classList.remove("swap");
  }, 250);
});
$("lang").addEventListener("click", () => { lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]; render(); });

$("ios").href = CONFIG.appStore;
$("android").href = CONFIG.playStore;
$("ig").href = CONFIG.instagram;

/* riconosce il telefono e mette in evidenza lo store giusto */
const ua = navigator.userAgent || "";
const isAndroid = /android/i.test(ua);
if (isAndroid) {
  $("android").classList.add("primary");
  $("stores").prepend($("android"));
} else {
  $("ios").classList.add("primary");
}

/* se c'è Google Analytics (gtag), manda anche lì gli eventi di clic */
document.querySelectorAll("[data-umami-event]").forEach(el => {
  el.addEventListener("click", () => {
    if (typeof window.gtag === "function") {
      window.gtag("event", el.getAttribute("data-umami-event"), { lingua: lang });
    }
  });
});

render();
</script>
